name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ServerDeck/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: ServerDeck
        run: npm ci

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ServerDeck
          tagName: ${{ github.ref_name }}
          releaseName: ServerDeck ${{ github.ref_name }}
          releaseBody: |
            Automated GitHub Release for ServerDeck.

            Assets include the macOS `.app` bundle and `.dmg` installer.
          releaseDraft: false
          prerelease: false
