name: Auto Release On Main Merge

on:
  pull_request_target:
    types:
      - closed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  auto-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: macos-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ServerDeck/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare next release version
        working-directory: ServerDeck
        run: node ./scripts/auto-release-on-main.mjs

      - name: Read version
        id: version
        working-directory: ServerDeck
        run: |
          VERSION=$(python3 - <<'PY'
          import json
          with open('package.json', 'r', encoding='utf-8') as f:
              print(json.load(f)['version'])
          PY
          )
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: release_notes
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          node ServerDeck/scripts/generate-release-notes.mjs "$RELEASE_TAG" > release-notes.md
          {
            echo 'body<<EOF'
            cat release-notes.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: ServerDeck
        run: npm ci

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git add ServerDeck/package.json \
            ServerDeck/package-lock.json \
            ServerDeck/src-tauri/Cargo.toml \
            ServerDeck/src-tauri/tauri.conf.json \
            docs/changelog.md
          git commit -m "chore(release): ${TAG_NAME}"
          git tag "${TAG_NAME}"
          git push origin main
          git push origin "${TAG_NAME}"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ServerDeck
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ServerDeck ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
